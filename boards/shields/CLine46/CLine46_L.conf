#Sleep config -------------------
# Kconfig.defconfig の default だけでは ZMK コア側の default(900000ms=15分)に
# 負けて反映されないため、.conf で明示的に上書きする(Kconfigのdefaultは
# 条件を満たす最初の1つが採用され、後から書いたdefaultでは上書きされない)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

#Bluetooth config -------------------
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# slave latency を下げて(default 30)アイドル後の無線同期の回復を速くし、
# 放置後の打鍵取りこぼしを減らす(R 側の設定と揃える)
CONFIG_BT_PERIPHERAL_PREF_LATENCY=15
