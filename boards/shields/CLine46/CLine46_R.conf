#Mouse config ---------------------
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=500
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_SMART_ALGORITHM=y

# 高解像度ホイールを有効化（OS 側でピクセル単位の補間 = smooth scroll）
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y


#Battery config -------------------
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y


#Layer LED config -------------------
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=n


#Sleep config -------------------
# Kconfig.defconfig の default だけでは ZMK コア側の default(900000ms=15分)に
# 負けて反映されないため、.conf で明示的に上書きする(Kconfigのdefaultは
# 条件を満たす最初の1つが採用され、後から書いたdefaultでは上書きされない)
# 電池消費対策のため 2時間→30分 に短縮(2026-07-27)。BLE再接続不安定が
# 再発する場合は要見直し
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

#Bluetooth config -------------------
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# slave latency は電池消費対策のため default(30) に戻した(2026-07-27)。
# 放置後の打鍵取りこぼしが再発する場合は 15 に戻すことを検討

# BLE 接続スロット（プロファイル + Peripheral）
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6
