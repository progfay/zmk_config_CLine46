#Mouse config ---------------------
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=500
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_SMART_ALGORITHM=y

# 高解像度ホイールを有効化（OS 側でピクセル単位の補間 = smooth scroll）
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y


#Battery config -------------------
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y


#Layer LED config -------------------
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=n


#Bluetooth config -------------------
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Zephyr 3.5 由来の BLE 接続安定性改善(split 再接続の信頼性向上)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# 検証用: central側のsplit bluetooth関連ログをUSBシリアルに出力
# (左のブラウンアウト疑惑を確認するため、central視点でscanning/disconnectを追う)
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG_DEFAULT_LEVEL=4

CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# BLE 接続スロット（プロファイル + Peripheral）
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6
