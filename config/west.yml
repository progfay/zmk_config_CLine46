manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: progfay
      url-base: https://github.com/progfay
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: takamaru-fpv
      url-base: https://github.com/takamaru-fpv

  projects:
    # progfay/zmk = zmkfirmware/zmk v0.3-branch + retro-tap をポインタ入力
    # (トラックボール)で解除するパッチ。ZMK 更新時はこのブランチを rebase する。
    - name: zmk
      remote: progfay
      revision: retro-tap-pointer-cancel-v0.3
      import: app/west.yml
    - name: zmk-feature-non-lipo-battery-management
      remote: takamaru-fpv
      revision: voltage_division
    - name: zmk-pmw3610-driver
      remote: badjeff
      # zmk-0.3 は upstream Zephyr の pixart,pmw3610 binding と compatible
      # 文字列が衝突してビルド不能。main で pixart,pmw3610-alt にリネームされ解消。
      revision: main
    - name: zmk-rgbled-widget
      remote: caksoylar
      # v0.3-branch には xiao_ble//zmk (Zephyr v4.1 board variant) 用の
      # rgbled_adapter overlay が無くビルド不能。main で追加された。
      revision: main
  self:
    path: config
